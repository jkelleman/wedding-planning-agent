<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Wedding Planning Agent</title>
  <desc id="d">A conversation design case study: an agent that explains itself, chooses its tone, and writes for the reader in front of it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF6F0"/>
      <stop offset="1" stop-color="#F3E7DC"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#3B1F33" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="1180" cy="-40" r="210" fill="#E9D3C4" opacity="0.55"/>
  <circle cx="760" cy="420" r="160" fill="#DCE5E0" opacity="0.7"/>

  <!-- Left: title block -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="84" width="36" height="4" rx="2" fill="#C8553D"/>
    <text x="120" y="91" font-size="14" font-weight="600" letter-spacing="2.4" fill="#C8553D">CONVERSATION DESIGN CASE STUDY</text>
    <text x="72" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#3B1F33">Wedding Planning</text>
    <text x="72" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-style="italic" fill="#3B1F33">Agent</text>
    <text x="72" y="282" font-size="19" fill="#6B5563">An agent that explains itself, picks its tone,</text>
    <text x="72" y="309" font-size="19" fill="#6B5563">and writes for whoever is reading.</text>
  </g>

  <!-- Right: conversation -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17">
    <g filter="url(#sh)">
      <rect x="868" y="62" width="330" height="54" rx="22" fill="#3B1F33"/>
      <path d="M1176 112 l18 14 l-4 -18 z" fill="#3B1F33"/>
    </g>
    <text x="892" y="95" fill="#FBF6F0">Is $130 a head a good deal?</text>

    <g filter="url(#sh)">
      <rect x="720" y="140" width="410" height="110" rx="22" fill="#FFFFFF"/>
      <path d="M742 246 l-16 16 l22 -6 z" fill="#FFFFFF"/>
    </g>
    <text x="746" y="174" fill="#3B1F33">Score 76/100. It's under budget, covers</text>
    <text x="746" y="200" fill="#3B1F33">gluten-free, and fits 20 guests.</text>
    <text x="746" y="230" fill="#8A7184" font-size="15">Here's why, line by line.</text>

    <g font-size="14" font-weight="600">
      <rect x="720" y="276" width="96" height="34" rx="17" fill="#DCE5E0"/>
      <text x="768" y="298" text-anchor="middle" fill="#2F4A42">Friendly</text>
      <rect x="828" y="276" width="124" height="34" rx="17" fill="#3B1F33"/>
      <text x="890" y="298" text-anchor="middle" fill="#FBF6F0">Professional</text>
      <rect x="964" y="276" width="76" height="34" rx="17" fill="#F2D6CD"/>
      <text x="1002" y="298" text-anchor="middle" fill="#8E3423">Firm</text>
    </g>
  </g>
</svg>
